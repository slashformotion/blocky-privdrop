name: Release

on:
  push:
    tags:
      - "v**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the tag that triggered the run)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: 0xERR0R/blocky

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -z "$tag" ]; then
            echo "No tag: run this workflow from a tag, or set the 'tag' input." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/blocky-privdrop-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/blocky-privdrop-linux-arm64 .

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes "Bundles [blocky $TAG](https://github.com/${UPSTREAM_REPO}/releases/tag/$TAG).

          Binaries must run as root or with \`CAP_NET_SETGID\`, \`CAP_NET_SETUID\`, and \`CAP_SETCAP\`; see the README."
          fi
